<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatnorLP Community RPG</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #f59e0b;
            --muted-color: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        /* Navigation / Filter Buttons */
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .shop-filter-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--muted-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .shop-filter-btn:hover, .shop-filter-btn.active {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        /* Shop Grid Layout */
        #shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .shop-item {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
        }

        .shop-item:hover {
            transform: translateY(-3px);
        }

        .price {
            font-weight: bold;
            color: #ffd700;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚔️ MatnorLP Community RPG</h1>
            <p>Willkommen im Ausrüstungsshop!</p>
        </header>

        <!-- Filter-Buttons -->
        <div class="nav-buttons">
            <button class="shop-filter-btn active" onclick="filterShop('all', this)">Alle</button>
            <button class="shop-filter-btn" onclick="filterShop('helm', this)">🪖 Helme</button>
            <button class="shop-filter-btn" onclick="filterShop('armor', this)">🛡️ Rüstungen</button>
            <button class="shop-filter-btn" onclick="filterShop('pants', this)">👖 Hosen</button>
            <button class="shop-filter-btn" onclick="filterShop('weapon', this)">⚔️ Waffen</button>
        </div>

        <!-- Hier werden die Shop-Items dynamisch geladen -->
        <div id="shop-grid"></div>
    </div>

    <script>
        let allShopItems = [];

        // Lädt die Shop-Daten aus der shop.json
        async function loadShopData() {
            try {
                const response = await fetch('shop.json?v=' + new Date().getTime());
                if (!response.ok) return;

                allShopItems = await response.json();
                renderShopItems('all');
            } catch (e) {
                console.log("Fehler beim Laden der shop.json", e);
            }
        }

        // Gibt die passende Rahmenfarbe für das jeweilige Tier zurück
        function getTierColor(tier) {
            if (tier <= 1) return "#9e9e9e"; // Grau / Standard
            if (tier === 2) return "#4caf50"; // Grün / Einsteiger
            if (tier === 3) return "#2196f3"; // Blau / Fortgeschritten
            if (tier === 4) return "#9c27b0"; // Violett / Meister
            if (tier === 5) return "#ffd700"; // Gold / Elite (Eisen)
            if (tier <= 8) return "#ff5722"; // Orange / Episch
            return "#e91e63";               // Mythic
        }

        // Hilfsfunktion zum Erstellen einer einzelnen Item-Karte
        function appendItemCard(container, item) {
            const card = document.createElement('div');
            card.className = 'shop-item';

            // Chat-Befehl generieren
            let buyCommand = `!kaufen ${item.slot}`;
            if (item.slot === 'armor') buyCommand = `!kaufen ruestung`;

            const tierColor = getTierColor(item.tier);
            card.style.border = `2px solid ${tierColor}`;
            card.style.boxShadow = `0 0 8px ${tierColor}33`;

            const imgSrc = item.image || 'https://via.placeholder.com/80?text=Item';

            card.innerHTML = `
                <img src="${imgSrc}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/80?text=Item'" style="width: 80px; height: 80px; object-fit: contain; margin-bottom: 10px;">
                <h4 style="color: ${tierColor}; margin: 5px 0; font-size: 16px;">${item.name}</h4>
                <p style="font-size: 12px; color: var(--muted-color); margin-bottom: 5px;">Tier ${item.tier}</p>
                <p style="margin: 5px 0; font-size: 13px;">
                    ${item.atk > 0 ? `<strong>ATK:</strong> +${item.atk} ` : ''}
                    ${item.def > 0 ? `<strong>DEF:</strong> +${item.def} ` : ''}
                </p>
                <p class="price" style="margin-top: 8px;">💰 ${item.price} Gold</p>
                <p style="background: rgba(243, 156, 18, 0.1); border: 1px solid #f39c12; color: #f39c12; padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 12px; margin-top: 8px;">>${buyCommand}</p>
            `;

            container.appendChild(card);
        }

        // Rendert die Items im Shop-Grid (entweder alle mit Kategorien oder gefiltert)
        function renderShopItems(filterSlot) {
            const grid = document.getElementById('shop-grid');
            if (!grid) return;

            grid.innerHTML = "";

            const slotOrder = [
                { key: 'helm', title: '🪖 Helme' },
                { key: 'armor', title: '🛡️ Rüstungen' },
                { key: 'pants', title: '👖 Hosen' },
                { key: 'weapon', title: '⚔️ Waffen' }
            ];

            if (filterSlot === 'all') {
                slotOrder.forEach(category => {
                    const categoryItems = allShopItems.filter(item => item.slot === category.key);
                    if (categoryItems.length === 0) return;

                    // Überschrift für die Kategorie
                    const heading = document.createElement('h3');
                    heading.innerText = category.title;
                    heading.style.cssText = "grid-column: 1 / -1; color: var(--accent-color); margin: 20px 0 10px 0; border-bottom: 1px solid #334155; padding-bottom: 5px;";
                    grid.appendChild(heading);

                    categoryItems.forEach(item => {
                        appendItemCard(grid, item);
                    });
                });
            } else {
                const filtered = allShopItems.filter(item => item.slot === filterSlot);
                if (filtered.length === 0) {
                    grid.innerHTML = "<p style='grid-column: 1 / -1; text-align: center;'>Keine Gegenstände in dieser Kategorie gefunden.</p>";
                    return;
                }
                filtered.forEach(item => {
                    appendItemCard(grid, item);
                });
            }
        }

        // Filter-Funktion für die Buttons
        function filterShop(slot, btnElement) {
            document.querySelectorAll('.shop-filter-btn').forEach(b => b.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
            renderShopItems(slot);
        }

        // Beim Laden der Seite ausführen
        window.onload = function() {
            loadShopData();
        };
    </script>
</body>
</html>
