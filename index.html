<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatnorLP Community RPG</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #f59e0b;
            --muted-color: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        /* Haupt-Tabs oben (Leaderboard / Shop / Info) */
        .main-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .main-tab-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--muted-color);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .main-tab-btn.active, .main-tab-btn:hover {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        /* Sektionen */
        .section {
            display: none;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #334155;
        }

        .section.active {
            display: block;
        }

        /* Navigation / Shop Filter Buttons */
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .shop-filter-btn {
            background-color: #0f172a;
            color: var(--text-color);
            border: 1px solid var(--muted-color);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .shop-filter-btn:hover, .shop-filter-btn.active {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        /* Shop Grid Layout */
        #shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .shop-item {
            background-color: #0f172a;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
        }

        .shop-item:hover {
            transform: translateY(-3px);
        }

        .price {
            font-weight: bold;
            color: #ffd700;
        }

        /* Leaderboard Tabelle */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        th {
            color: var(--accent-color);
        }

        /* Top 3 Leaderboard Highlights */
        table tbody tr:nth-child(1) {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.3), rgba(255, 215, 0, 0.08));
            border-left: 5px solid #ffd700;
        }

        table tbody tr:nth-child(2) {
            background: linear-gradient(135deg, rgba(192, 192, 192, 0.3), rgba(192, 192, 192, 0.08));
            border-left: 5px solid #c0c0c0;
        }

        table tbody tr:nth-child(3) {
            background: linear-gradient(135deg, rgba(205, 127, 50, 0.3), rgba(205, 127, 50, 0.08));
            border-left: 5px solid #cd7f32;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚔️ MatnorLP Community RPG</h1>
            <p>Willkommen in der Ruhmeshalle und im Ausrüstungsshop!</p>
        </header>

        <!-- Haupt-Navigation (Tabs) -->
        <div class="main-tabs">
            <button class="main-tab-btn" onclick="switchTab('leaderboard', this)">🏆 Leaderboard</button>
            <button class="main-tab-btn active" onclick="switchTab('shop', this)">🛒 Item-Shop</button>
        </div>

        <!-- LEADERBOARD SEKTION -->
        <div id="leaderboard-section" class="section">
            <h2>Ruhmeshalle</h2>
            <table>
                <thead>
                    <tr>
                        <th>Rang</th>
                        <th>Name</th>
                        <th>Gold</th>
                        <th>Ausrüstung</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <tr><td colspan="4" style="text-align: center;">Lade Leaderboard...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- ITEM-SHOP SEKTION -->
        <div id="shop-section" class="section active">
            <h2>Ausrüstungsshop</h2>
            <p style="color: var(--muted-color); font-size: 14px; margin-bottom: 20px;">Hier kannst du dich mit neuer Ausrüstung für deine nächsten Kämpfe eindecken!</p>
            
            <!-- Filter-Buttons -->
            <div class="nav-buttons">
                <button class="shop-filter-btn active" onclick="filterShop('all', this)">Alle</button>
                <button class="shop-filter-btn" onclick="filterShop('helm', this)">🪖 Helme</button>
                <button class="shop-filter-btn" onclick="filterShop('armor', this)">🛡️ Rüstungen</button>
                <button class="shop-filter-btn" onclick="filterShop('pants', this)">👖 Hosen</button>
                <button class="shop-filter-btn" onclick="filterShop('weapon', this)">⚔️ Waffen</button>
            </div>

            <!-- Shop Grid -->
            <div id="shop-grid"></div>
        </div>
    </div>

    <script>
        let allShopItems = [];

        // Tab-Umschaltung zwischen Leaderboard und Shop
        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));

            if (tabName === 'leaderboard') {
                document.getElementById('leaderboard-section').classList.add('active');
            } else {
                document.getElementById('shop-section').classList.add('active');
            }
            if (btnElement) btnElement.classList.add('active');
        }

        // Leaderboard Daten laden
        async function loadLeaderboardData() {
            try {
                const response = await fetch('leaderboard.json?v=' + new Date().getTime());
                if (!response.ok) return;
                const data = await response.json();
                
                const tbody = document.getElementById('leaderboard-body');
                if (!tbody) return;
                tbody.innerHTML = "";

                data.forEach((player, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong>#${index + 1}</strong></td>
                        <td>${player.name}</td>
                        <td>💰 ${player.gold}</td>
                        <td>Helm: ${player.helm || 'Keiner'}, Rüstung: ${player.ruestung || 'Keiner'}, Waffe: ${player.waffe || 'Keiner'}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (e) {
                console.log("Fehler beim Laden der leaderboard.json", e);
            }
        }

        // Shop Daten laden
        async function loadShopData() {
            try {
                const response = await fetch('shop.json?v=' + new Date().getTime());
                if (!response.ok) return;

                allShopItems = await response.json();
                renderShopItems('all');
            } catch (e) {
                console.log("Fehler beim Laden der shop.json", e);
            }
        }

        // Rahmenfarben nach Tier
        function getTierColor(tier) {
            if (tier <= 1) return "#9e9e9e"; // Grau
            if (tier === 2) return "#4caf50"; // Grün
            if (tier === 3) return "#2196f3"; // Blau
            if (tier === 4) return "#9c27b0"; // Violett
            if (tier === 5) return "#ffd700"; // Gold
            if (tier <= 8) return "#ff5722"; // Orange
            return "#e91e63";               // Mythic
        }

        // Einzelne Item-Karte erstellen
        function appendItemCard(container, item) {
            const card = document.createElement('div');
            card.className = 'shop-item';

            let buyCommand = `!kaufen ${item.slot}`;
            if (item.slot === 'armor') buyCommand = `!kaufen ruestung`;

            const tierColor = getTierColor(item.tier);
            card.style.border = `2px solid ${tierColor}`;
            card.style.boxShadow = `0 0 8px ${tierColor}33`;

            const imgSrc = item.image || 'https://via.placeholder.com/80?text=Item';

            card.innerHTML = `
                <img src="${imgSrc}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/80?text=Item'" style="width: 80px; height: 80px; object-fit: contain; margin-bottom: 10px;">
                <h4 style="color: ${tierColor}; margin: 5px 0; font-size: 16px;">${item.name}</h4>
                <p style="font-size: 12px; color: var(--muted-color); margin-bottom: 5px;">Tier ${item.tier}</p>
                <p style="margin: 5px 0; font-size: 13px;">
                    ${item.atk > 0 ? `<strong>ATK:</strong> +${item.atk} ` : ''}
                    ${item.def > 0 ? `<strong>DEF:</strong> +${item.def} ` : ''}
                </p>
                <p class="price" style="margin-top: 8px;">💰 ${item.price} Gold</p>
                <p style="background: rgba(243, 156, 18, 0.1); border: 1px solid #f39c12; color: #f39c12; padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 12px; margin-top: 8px;">>${buyCommand}</p>
            `;

            container.appendChild(card);
        }

        // Shop-Items rendern (mit Kategorien)
        function renderShopItems(filterSlot) {
            const grid = document.getElementById('shop-grid');
            if (!grid) return;

            grid.innerHTML = "";

            const slotOrder = [
                { key: 'helm', title: '🪖 Helme' },
                { key: 'armor', title: '🛡️ Rüstungen' },
                { key: 'pants', title: '👖 Hosen' },
                { key: 'weapon', title: '⚔️ Waffen' }
            ];

            if (filterSlot === 'all') {
                slotOrder.forEach(category => {
                    const categoryItems = allShopItems.filter(item => item.slot === category.key);
                    if (categoryItems.length === 0) return;

                    const heading = document.createElement('h3');
                    heading.innerText = category.title;
                    heading.style.cssText = "grid-column: 1 / -1; color: var(--accent-color); margin: 20px 0 10px 0; border-bottom: 1px solid #334155; padding-bottom: 5px;";
                    grid.appendChild(heading);

                    categoryItems.forEach(item => {
                        appendItemCard(grid, item);
                    });
                });
            } else {
                const filtered = allShopItems.filter(item => item.slot === filterSlot);
                if (filtered.length === 0) {
                    grid.innerHTML = "<p style='grid-column: 1 / -1; text-align: center;'>Keine Gegenstände in dieser Kategorie gefunden.</p>";
                    return;
                }
                filtered.forEach(item => {
                    appendItemCard(grid, item);
                });
            }
        }

        // Shop Filter Buttons
        function filterShop(slot, btnElement) {
            document.querySelectorAll('.shop-filter-btn').forEach(b => b.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
            renderShopItems(slot);
        }

        // Beim Laden der Seite beide Datenquellen abrufen
        window.onload = function() {
            loadLeaderboardData();
            loadShopData();
            setInterval(loadLeaderboardData, 30000); // Aktualisiert das Leaderboard alle 30 Sek.
        };
    </script>
</body>
</html>
